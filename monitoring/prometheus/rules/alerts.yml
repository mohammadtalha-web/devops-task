groups:
  - name: app
    rules:
      - alert: AppInstanceDown
        expr: up{job="app"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "App instance {{ $labels.instance }} is down"
          description: "Prometheus could not scrape {{ $labels.instance }} for 1 minute."

      - alert: AppHighErrorRate
        expr: |
          sum(rate(http_errors_total[5m])) / sum(rate(http_requests_total[5m])) > 0.05
          and sum(rate(http_requests_total[5m])) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 5% of requests are failing with 5xx"
          description: "Error ratio is {{ $value | humanizePercentage }} over the last 5m."

      - alert: AppHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency above 500ms"
          description: "p95 latency is {{ $value | humanizeDuration }}."

  - name: host
    rules:
      - alert: HostDiskUsageHigh
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
               / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}) > 0.80
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is over 80% full"
          description: "Usage is {{ $value | humanizePercentage }}."

      - alert: HostHighCpu
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Host CPU above 90% for 15 minutes"

      - alert: HostMemoryLow
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Host memory above 90% used"

  - name: containers
    rules:
      - alert: ContainerMemoryNearLimit
        expr: |
          max by (name) (container_memory_working_set_bytes{name!=""})
          / max by (name) (container_spec_memory_limit_bytes{name!=""} > 0) > 0.90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} is above 90% of its memory limit"
          description: "Working set is {{ $value | humanizePercentage }} of the limit; OOM-kill risk."
